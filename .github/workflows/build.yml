name: Build Electron App

on:
  push:
    branches:
      - win-mac
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron Builder
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: mac-electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mac-electron-${{ runner.os }}-

      - name: Install deps
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w nfc-pcsc

      - name: Install app deps
        run: npx electron-builder install-app-deps

      - name: Build DMG
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Electron Builder
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: win-electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            win-electron-${{ runner.os }}-

      - name: Install deps
        run: npm ci

      - name: Rebuild native modules
        run: npx electron-rebuild -f -w nfc-pcsc

      - name: Install app deps
        run: npx electron-builder install-app-deps

      - name: Build EXE
        run: npm run dist:win

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error
